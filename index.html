<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Calculate your shift end time and see the remaining countdown."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Shift Timer</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-shift-status="empty">
    <button
      class="theme-toggle"
      id="theme-toggle"
      type="button"
      role="switch"
      aria-checked="false"
      aria-label="Switch to dark mode"
    >
      <span class="theme-toggle__track" aria-hidden="true">
        <span class="theme-toggle__thumb"></span>
        <span class="theme-toggle__icon theme-toggle__icon--moon"></span>
        <span class="theme-toggle__icon theme-toggle__icon--sun"></span>
      </span>
    </button>

    <main class="app" aria-label="Shift countdown timer">
      <form id="shift-form" novalidate>
        <label class="sr-only" for="time-in">Time In</label>
        <input
          id="time-in"
          name="time-in"
          type="text"
          inputmode="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Time in: (eg. 07:31:41 AM)"
          aria-describedby="input-error"
          aria-invalid="false"
        />
        <p id="input-error" role="alert" hidden></p>
      </form>

      <section id="result" aria-label="Shift result" hidden>
        <p id="status-label">Shift in progress</p>
        <p id="countdown" aria-label="Time remaining">00:00:00</p>
        <p class="remaining-label" id="countdown-caption">remaining</p>
        <p class="target">
          Ends at <strong id="target-time">-</strong>
          <span id="target-date"></span>
        </p>
        <button id="reset-button" type="button">Reset</button>
      </section>

      <p
        class="sr-only"
        id="status-announcement"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </main>

    <noscript>
      <p class="noscript">JavaScript is required.</p>
    </noscript>

    <script src="assets/js/core.js" defer></script>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
